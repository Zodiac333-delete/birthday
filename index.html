<!DOCTYPE html>
<html lang="ru">
<head>
	<title>С Днём Рождения!</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="stylesheet.css">
	<link href='https://googleapis.com' rel='stylesheet' type='text/css'>
	<link rel="stylesheet/less" href="cake.less">
	<script src="https://cloudflare.com"></script>
</head>

<body>
	<audio class="song" controls loop>
        <source src="hbd.mp3"></source>
    </audio>
    <div class="balloons text-center" id="b1"><h2 style="color:#F2B300;">Т</h2></div>
    <div class="balloons text-center" id="b2"><h2 style="color:#0719D4;">А</h2></div>
	<div class="balloons text-center" id="b3"><h2 style="color:#D14D39;">Т</h2></div>
	<div class="balloons text-center" id="b4"><h2 style="color:#8FAD00;">Ь</h2></div>
	<div class="balloons text-center" id="b5"><h2 style="color:#8377E4;">Я</h2></div>
    <div class="balloons text-center" id="b6"><h2 style="color:#99C96A;">Н</h2></div>
    <div class="balloons text-center" id="b7"><h2 style="color:#20CFB4;">А</h2></div>

    <img src="Balloon-Border.png" width="100%" class="balloon-border">

	<div class="container">
		<div class="row">
			<div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_yellow"></div></div>
			<div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_red"></div></div>
			<div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_blue"></div></div>
			<div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_green"></div></div>
			<div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_pink"></div></div>
			<div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_orange"></div></div>
		</div>
		<div class="row">
			<div class="col-md-12 text-center">
				<img src="banner.png" class="bannar">
			</div>
		</div>
		<div class="row cake-cover">
			<div class="col-md-12 texr-center">
				<div class="cake">
				  <div class="velas">
				    <div class="fuego"></div>
				    <div class="fuego"></div>
				    <div class="fuego"></div>
				    <div class="fuego"></div>
				    <div class="fuego"></div>
				  </div>
				  <div class="cobertura"></div>
				  <div class="bizcocho"></div>
				</div>
			</div>
		</div>
		<div class="row message">
			<div class="col-md-12">
				<p>Сегодня...</p>
				<p>вроде бы обычный день, как и все остальные</p>
				<p>но на самом деле он особенный</p>
				<p>потому что это твой день</p>
				<p>Я сделал эту страницу специально для тебя</p>
				<p>Спасибо тебе за всё, за поддержку и заботу</p>
				<p>С Днём Рождения, мам! ❤️</p>
			</div>
		</div>
		<div class="navbar navbar-fixed-bottom">
			<div class="row">
				<div class="col-md-6 text-center col-md-offset-3">
					<button class="btn btn-primary" id="turn_on">Включить свет</button>
					<button class="btn btn-primary" id="play">Включить музыку</button>
					<button class="btn btn-primary" id="bannar_coming">Украсить</button>
					<button class="btn btn-primary" id="balloons_flying">Запустить шары</button>
					<button class="btn btn-primary" id="cake_fadein">Показать торт</button>
					<button class="btn btn-primary" id="light_candle">Зажечь свечи</button>
					<button class="btn btn-primary" id="wish_message">С Днём Рождения!</button>
					<button class="btn btn-primary" id="story">Сообщение для тебя</button>
				</div>
			</div>
		</div>
	</div>
</body>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/js/bootstrap.min.js"></script>
<script src="effect.js"></script>
</html>
